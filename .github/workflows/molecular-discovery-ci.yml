name: molecular-discovery-ci

on:
  pull_request:
    paths:
      - "src/research_os/molecular_discovery/**"
      - "scripts/run_molecular_discovery.py"
      - "scripts/run_moldisc_001.py"
      - "scripts/run_moldisc_002.py"
      - "scripts/run_moldisc_003.py"
      - "scripts/run_moldisc_004.py"
      - "scripts/run_moldisc_005.py"
      - "scripts/run_moldisc_007.py"
      - "scripts/run_moldisc_008.py"
      - "programs/moldisc-001-id5/**"
      - "programs/moldisc-002-aqsoldb-coverage/**"
      - "programs/moldisc-003-redock-seed-coverage/**"
      - "programs/moldisc-004-nct-measured-anchor/**"
      - "programs/moldisc-005-nct-nalkyl-series/**"
      - "programs/moldisc-007-operational-fallback/**"
      - "programs/moldisc-008-je2-evidence-profile/**"
      - "tests/test_molecular_discovery.py"
      - "tests/test_moldisc_001.py"
      - "tests/test_moldisc_002.py"
      - "tests/test_moldisc_003.py"
      - "tests/test_moldisc_004.py"
      - "tests/test_moldisc_005.py"
      - "tests/test_moldisc_007.py"
      - "tests/test_moldisc_008.py"
      - "validation/molecular-discovery-solubility-v1.json"
      - "validation/moldisc-001-first-run-v1.json"
      - "validation/moldisc-002-first-run-v1.json"
      - "validation/moldisc-003-first-run-v1.json"
      - "validation/moldisc-004-first-run-v1.json"
      - "validation/moldisc-005-first-run-v1.json"
      - "validation/moldisc-007-first-run-v1.json"
      - "validation/moldisc-008-first-run-v1.json"
      - "docs/molecular-discovery-program-v0.1.md"
      - "docs/moldisc-001-id5.md"
      - "docs/moldisc-002-aqsoldb-coverage.md"
      - "docs/moldisc-003-redock-seed-coverage.md"
      - "docs/moldisc-004-nct-measured-anchor.md"
      - "docs/moldisc-005-nct-nalkyl-series.md"
      - "docs/moldisc-007-operational-fallback.md"
      - "docs/moldisc-008-je2-evidence-profile.md"
      - "pyproject.toml"
      - ".github/workflows/molecular-discovery-ci.yml"
  push:
    branches:
      - main
    paths:
      - "src/research_os/molecular_discovery/**"
      - "scripts/run_molecular_discovery.py"
      - "scripts/run_moldisc_001.py"
      - "scripts/run_moldisc_002.py"
      - "scripts/run_moldisc_003.py"
      - "scripts/run_moldisc_004.py"
      - "scripts/run_moldisc_005.py"
      - "scripts/run_moldisc_007.py"
      - "scripts/run_moldisc_008.py"
      - "programs/moldisc-001-id5/**"
      - "programs/moldisc-002-aqsoldb-coverage/**"
      - "programs/moldisc-003-redock-seed-coverage/**"
      - "programs/moldisc-004-nct-measured-anchor/**"
      - "programs/moldisc-005-nct-nalkyl-series/**"
      - "programs/moldisc-007-operational-fallback/**"
      - "programs/moldisc-008-je2-evidence-profile/**"
      - "tests/test_molecular_discovery.py"
      - "tests/test_moldisc_001.py"
      - "tests/test_moldisc_002.py"
      - "tests/test_moldisc_003.py"
      - "tests/test_moldisc_004.py"
      - "tests/test_moldisc_005.py"
      - "tests/test_moldisc_007.py"
      - "tests/test_moldisc_008.py"
      - "validation/molecular-discovery-solubility-v1.json"
      - "validation/moldisc-001-first-run-v1.json"
      - "validation/moldisc-007-first-run-v1.json"
      - "validation/moldisc-008-first-run-v1.json"
      - "docs/moldisc-001-id5.md"
      - "docs/moldisc-007-operational-fallback.md"
      - "docs/moldisc-008-je2-evidence-profile.md"
      - "pyproject.toml"
      - ".github/workflows/molecular-discovery-ci.yml"

jobs:
  discovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Molecular Discovery dependencies
        run: python -m pip install -e ".[dev,discovery]"
      - name: Check dependency consistency
        run: python -m pip check
      - name: Compile Molecular Discovery
        run: python -m compileall -q src/research_os/molecular_discovery scripts/run_molecular_discovery.py scripts/run_moldisc_001.py scripts/run_moldisc_002.py scripts/run_moldisc_003.py scripts/run_moldisc_004.py scripts/run_moldisc_005.py scripts/run_moldisc_007.py scripts/run_moldisc_008.py tests/test_molecular_discovery.py tests/test_moldisc_001.py tests/test_moldisc_002.py tests/test_moldisc_003.py tests/test_moldisc_004.py tests/test_moldisc_005.py tests/test_moldisc_007.py tests/test_moldisc_008.py
      - name: Run Molecular Discovery tests
        run: python -m pytest -q tests/test_molecular_discovery.py tests/test_moldisc_001.py tests/test_moldisc_002.py tests/test_moldisc_003.py tests/test_moldisc_004.py tests/test_moldisc_005.py tests/test_moldisc_007.py
      - name: Execute frozen MOLDISC-001 from public ESOL source
        run: python scripts/run_moldisc_001.py --output /tmp/moldisc-001
      - name: Verify MOLDISC-001 artifacts
        run: |
          python - <<'PY'
          import csv
          import json
          from pathlib import Path

          root = Path("/tmp/moldisc-001")
          manifest = json.loads((root / "program_manifest.json").read_text())
          generation = json.loads((root / "generation.json").read_text())
          with (root / "workflow" / "candidates.csv").open(newline="") as handle:
              candidates = list(csv.DictReader(handle))

          assert manifest["program_id"] == "MOLDISC-001"
          assert manifest["candidate_count"] == 9
          assert generation["candidate_count"] == 8
          assert len(candidates) == 9
          assert all(row["chemistry_status"] == "PASS" for row in candidates)
          assert all(row["docking_status"] == "NOT_REQUESTED" for row in candidates)
          print(json.dumps({
              "program_scientific_hash": manifest["program_scientific_hash"],
              "generation_scientific_hash": manifest["generation_scientific_hash"],
              "workflow_scientific_summary_hash": manifest["workflow_scientific_summary_hash"],
              "triage": [
                  {
                      "review_order": row["review_order"],
                      "candidate_id": row["candidate_id"],
                      "priority_group": row["priority_group"],
                      "solubility_status": row["solubility_status"],
                      "predicted_log_s_mol_l": row["predicted_log_s_mol_l"],
                      "max_training_tanimoto": row["max_training_tanimoto"],
                  }
                  for row in candidates
              ],
          }, indent=2, sort_keys=True))
          PY

      - name: Execute frozen MOLDISC-002 from immutable AqSolDB source
        run: python scripts/run_moldisc_002.py --output /tmp/moldisc-002
      - name: Verify MOLDISC-002 artifacts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("/tmp/moldisc-002")
          manifest = json.loads((root / "program_manifest.json").read_text())
          coverage = json.loads((root / "coverage.json").read_text())

          assert manifest["program_id"] == "MOLDISC-002"
          assert manifest["candidate_count"] == 9
          assert manifest["parent_generation_scientific_hash"] == "d2881a9906a6a60d54e90a303601d9509983e6f1a0b9ce01a0792bf088890abe"
          assert coverage["source_row_count"] == 9982
          assert coverage["parsed_source_hash"] == "2c6e56f56389f0fd99fa2a3c843446f98b6b068a3f93aaab71a08822caa085f4"
          assert coverage["candidate_count"] == 9
          assert len(coverage["candidates"]) == 9
          assert all(item["top_neighbors"] for item in coverage["candidates"])
          print(json.dumps({
              "program_scientific_hash": manifest["program_scientific_hash"],
              "coverage_scientific_hash": manifest["coverage_scientific_hash"],
              "unique_structure_count": coverage["unique_structure_count"],
              "invalid_structure_count": coverage["invalid_structure_count"],
              "candidates": [
                  {
                      "candidate_id": item["candidate_id"],
                      "nearest_similarity": item["nearest_similarity"],
                      "similarity_bin": item["similarity_bin"],
                      "neighbors_ge_0_4": item["neighbors_ge_0_4"],
                      "neighbors_ge_0_6": item["neighbors_ge_0_6"],
                      "neighbors_ge_0_8": item["neighbors_ge_0_8"],
                      "top_neighbor": item["top_neighbors"][0],
                  }
                  for item in coverage["candidates"]
              ],
          }, indent=2, sort_keys=True))
          PY

      - name: Execute frozen MOLDISC-003 REDOCK-003 seed coverage scan
        run: python scripts/run_moldisc_003.py --output /tmp/moldisc-003
      - name: Verify MOLDISC-003 artifacts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("/tmp/moldisc-003")
          manifest = json.loads((root / "program_manifest.json").read_text())
          identities = json.loads((root / "rcsb_identities.json").read_text())
          coverage = json.loads((root / "coverage.json").read_text())

          assert manifest["program_id"] == "MOLDISC-003"
          assert len(identities["identities"]) == 15
          assert coverage["candidate_count"] == 15
          assert len(coverage["candidates"]) == 15
          assert manifest["selection"]["eligibility_boundary"] == 0.4
          print(json.dumps({
              "rcsb_identity_hash": manifest["rcsb_identity_hash"],
              "coverage_scientific_hash": manifest["coverage_scientific_hash"],
              "program_scientific_hash": manifest["program_scientific_hash"],
              "selection": manifest["selection"],
              "candidates": [
                  {
                      "case_id": item["candidate_id"],
                      "nearest_similarity": item["nearest_similarity"],
                      "similarity_bin": item["similarity_bin"],
                      "neighbors_ge_0_4": item["neighbors_ge_0_4"],
                      "top_neighbor": item["top_neighbors"][0] if item["top_neighbors"] else None,
                  }
                  for item in sorted(
                      coverage["candidates"],
                      key=lambda row: (-row["nearest_similarity"], row["candidate_id"]),
                  )
              ],
          }, indent=2, sort_keys=True))
          PY

      - name: Execute frozen MOLDISC-004 NCT measured-anchor calibration
        run: python scripts/run_moldisc_004.py --output /tmp/moldisc-004
      - name: Verify MOLDISC-004 artifacts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("/tmp/moldisc-004")
          manifest = json.loads((root / "program_manifest.json").read_text())
          assessment = json.loads((root / "assessment.json").read_text())

          assert manifest["program_id"] == "MOLDISC-004"
          assert manifest["anchor"]["source_id"] == "E-468"
          assert manifest["anchor"]["inchikey"] == "SNICXCGAKADSCV-UHFFFAOYSA-N"
          assert manifest["anchor"]["measured_log_s_mol_l"] == 0.79
          assert assessment["chemistry_status"] == "PASS"
          assert assessment["docking_status"] == "NOT_REQUESTED"
          print(json.dumps({
              "anchor": manifest["anchor"],
              "calibration": manifest["calibration"],
              "workflow_scientific_summary_hash": manifest["workflow_scientific_summary_hash"],
              "program_scientific_hash": manifest["program_scientific_hash"],
          }, indent=2, sort_keys=True))
          PY

      - name: Execute frozen MOLDISC-005 NCT N-alkyl dual-evidence series
        run: python scripts/run_moldisc_005.py --output /tmp/moldisc-005
      - name: Verify MOLDISC-005 artifacts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("/tmp/moldisc-005")
          manifest = json.loads((root / "program_manifest.json").read_text())
          generation = json.loads((root / "generation.json").read_text())
          profiles = json.loads((root / "evidence_profiles.json").read_text())["profiles"]

          assert manifest["program_id"] == "MOLDISC-005"
          assert len(generation["analogs"]) == 3
          assert {item["variant_id"] for item in generation["analogs"]} == {"N-H", "N-ETHYL", "N-PROPYL"}
          assert len(profiles) == 4
          assert sum(item["source_role"] == "GENERATED" for item in profiles) == 3
          assert all(item["chemistry_status"] == "PASS" for item in profiles)
          print(json.dumps({
              "generation_scientific_hash": manifest["generation_scientific_hash"],
              "workflow_scientific_summary_hash": manifest["workflow_scientific_summary_hash"],
              "coverage_scientific_hash": manifest["coverage_scientific_hash"],
              "selection": manifest["selection"],
              "program_scientific_hash": manifest["program_scientific_hash"],
              "profiles": profiles,
          }, indent=2, sort_keys=True))
          PY

      - name: Execute frozen MOLDISC-007 operational fallback selection
        run: python scripts/run_moldisc_007.py --output /tmp/moldisc-007
      - name: Verify MOLDISC-007 artifacts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("/tmp/moldisc-007")
          manifest = json.loads((root / "program_manifest.json").read_text())
          selection = json.loads((root / "selection.json").read_text())

          assert manifest["program_id"] == "MOLDISC-007"
          assert manifest["selection"]["selected_case_id"] == "ATX-007"
          assert manifest["selection"]["selected_pdb_id"] == "1KZK"
          assert manifest["selection"]["selected_chem_comp_id"] == "JE2"
          assert manifest["selection"]["eligible_case_ids"] == ["ATX-007"]
          assert len(manifest["program_scientific_hash"]) == 64
          assert selection["candidate_evidence"][0]["case_id"] == "ATX-014"
          assert selection["candidate_evidence"][0]["operationally_blocked"] is True
          print(json.dumps({
              "selection": manifest["selection"],
              "program_scientific_hash": manifest["program_scientific_hash"],
          }, indent=2, sort_keys=True))
          PY

      - name: Execute frozen MOLDISC-008 JE2 evidence profile
        run: python scripts/run_moldisc_008.py --output /tmp/moldisc-008
      - name: Verify MOLDISC-008 artifacts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("/tmp/moldisc-008")
          manifest = json.loads((root / "program_manifest.json").read_text())
          assessment = json.loads((root / "assessment.json").read_text())
          coverage = json.loads((root / "coverage.json").read_text())
          profile = manifest["profile"]

          assert manifest["program_id"] == "MOLDISC-008"
          assert manifest["rcsb_identity"]["case_id"] == "ATX-007"
          assert manifest["rcsb_identity"]["pdb_id"] == "1KZK"
          assert manifest["rcsb_identity"]["chem_comp_id"] == "JE2"
          assert assessment["chemistry_status"] == "PASS"
          assert assessment["docking_status"] == "NOT_REQUESTED"
          assert coverage["parsed_source_hash"] == "2c6e56f56389f0fd99fa2a3c843446f98b6b068a3f93aaab71a08822caa085f4"
          assert abs(profile["aqsoldb_nearest_similarity"] - 0.569620253164557) < 1e-12
          assert profile["generation_source_ready"] is True
          assert len(manifest["program_scientific_hash"]) == 64

          print(json.dumps({
              "rcsb_identity": manifest["rcsb_identity"],
              "profile": profile,
              "workflow_scientific_summary_hash": manifest["workflow_scientific_summary_hash"],
              "aqsoldb_coverage_scientific_hash": manifest["aqsoldb_coverage_scientific_hash"],
              "predictor_model_identity": manifest["predictor_model_identity"],
              "program_scientific_hash": manifest["program_scientific_hash"],
          }, indent=2, sort_keys=True))
          PY
