name: molecular-discovery-ci

on:
  pull_request:
    paths:
      - "src/research_os/molecular_discovery/**"
      - "scripts/run_molecular_discovery.py"
      - "tests/test_molecular_discovery.py"
      - "validation/molecular-discovery-solubility-v1.json"
      - "docs/molecular-discovery-program-v0.1.md"
      - "pyproject.toml"
      - ".github/workflows/molecular-discovery-ci.yml"
  push:
    branches:
      - main
    paths:
      - "src/research_os/molecular_discovery/**"
      - "scripts/run_molecular_discovery.py"
      - "tests/test_molecular_discovery.py"
      - "validation/molecular-discovery-solubility-v1.json"
      - "pyproject.toml"
      - ".github/workflows/molecular-discovery-ci.yml"

jobs:
  discovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Molecular Discovery dependencies
        run: python -m pip install -e ".[dev,discovery]"
      - name: Check dependency consistency
        run: python -m pip check
      - name: Compile Molecular Discovery
        run: python -m compileall -q src/research_os/molecular_discovery scripts/run_molecular_discovery.py tests/test_molecular_discovery.py
      - name: Run Molecular Discovery tests
        run: python -m pytest -q tests/test_molecular_discovery.py
