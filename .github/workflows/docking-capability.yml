name: docking-capability-profile

on:
  pull_request:
    paths:
      - "configs/docking-capability-profile-v1.json"
      - "validation/docking-capability-profile-v1.json"
      - "src/research_os/docking/capability.py"
      - "src/research_os/docking/claims.py"
      - "src/research_os/docking/lab.py"
      - "tests/test_docking_capability.py"
      - "docs/docking-capability-profile-v1.md"
  push:
    branches: [research-os-v1.3]
    paths:
      - "configs/docking-capability-profile-v1.json"
      - "validation/docking-capability-profile-v1.json"
      - "src/research_os/docking/capability.py"
      - "src/research_os/docking/claims.py"
      - "src/research_os/docking/lab.py"
      - "tests/test_docking_capability.py"

jobs:
  capability-profile:
    name: bounded docking capability (no docking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Validate profile identity and references
        run: python -c "from research_os.docking.capability import load_profile; p=load_profile(); assert p.profile_id == 'research-os.docking.capability-profile.v1+b8c5c799b2035bae'; assert p.evidence_level.value == 'E2_COMPUTATIONAL'; print(p.profile_id)"
      - name: Run capability and DockingLab tests without engines
        run: python -m pytest -q tests/test_docking_capability.py tests/test_docking_lab.py
      - name: Compile capability integration
        run: python -m py_compile src/research_os/docking/capability.py src/research_os/docking/claims.py src/research_os/docking/lab.py
      - name: Confirm this workflow contains no docking invocation
        run: python -c "from pathlib import Path; text=Path('.github/workflows/docking-capability.yml').read_text().lower(); forbidden=['v'+'ina','auto'+'dock','execute'+'_'+'prospective']; assert not any(item in text for item in forbidden); print('No docking invocation in capability workflow.')"
