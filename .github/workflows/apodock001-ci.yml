name: apodock001-preflight

on:
  pull_request:
    branches:
      - research-os-v1.3
    paths:
      - "src/research_os/docking/apodock001.py"
      - "src/research_os/docking/apodock001_protocol.py"
      - "src/research_os/docking/apodock001_runner.py"
      - "src/research_os/docking/apodock001_freeze.py"
      - "src/research_os/docking/apodock_glycan.py"
      - "src/research_os/docking/apodock_glycan_chemistry.py"
      - "src/research_os/docking/apodock_glycan_freeze.py"
      - "scripts/preflight_apodock001.py"
      - "scripts/preflight_apodock001_protocol.py"
      - "scripts/preflight_apd010_bem_mav.py"
      - "tests/test_apodock001.py"
      - "tests/test_apodock001_protocol_freeze.py"
      - "tests/test_apodock_glycan_chemistry.py"
      - "docs/apodocking-benchmark-001-large-motion-v1.0.md"
      - "docs/apodock001-protocol-freeze-v1.0.md"
      - "docs/apodock001-protocol-erratum-v1.0.1.md"
      - "configs/apodock001-protocol-freeze-v1.0.json"
      - "configs/apodock001-protocol-freeze-v1.0.1.json"
      - "docs/apd010-bem-mav-chemistry-gate-v1.0.md"
      - ".github/workflows/apodock001-ci.yml"

permissions:
  contents: read

jobs:
  structural-preflight-no-vina:
    name: APODOCK-001 structural preflight (no Vina)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install structural preflight dependencies
        run: python -m pip install -e ".[dev,molecule]"

      - name: Check dependency consistency
        run: python -m pip check

      - name: Compile prospective APODOCK protocol
        run: >-
          python -m py_compile
          src/research_os/docking/apodock001.py
          src/research_os/docking/apodock001_protocol.py
          src/research_os/docking/apodock001_runner.py
          src/research_os/docking/apodock001_freeze.py
          src/research_os/docking/apodock_glycan.py
          src/research_os/docking/apodock_glycan_chemistry.py
          src/research_os/docking/apodock_glycan_freeze.py
          scripts/preflight_apodock001.py
          scripts/preflight_apodock001_protocol.py
          scripts/preflight_apd010_bem_mav.py
          tests/test_apodock001.py
          tests/test_apodock001_protocol_freeze.py
          tests/test_apodock_glycan_chemistry.py

      - name: Test frozen source cohort and alignment semantics
        run: python -m pytest -q tests/test_apodock001.py

      - name: Test frozen APODOCK-001 protocol identity and fail-closed boundaries
        run: python -m pytest -q tests/test_apodock001_protocol_freeze.py

      - name: Verify declarative APODOCK-001 protocol without docking
        run: >-
          python scripts/preflight_apodock001_protocol.py
          --output /tmp/apodock001-evidence/apodock001-protocol-freeze-v1.0.1.json

      - name: Test APD-010 fail-closed chemistry adapter
        run: python -m pytest -q tests/test_apodock_glycan_chemistry.py

      - name: Verify Vina binary is absent
        shell: bash
        run: |
          if command -v vina >/dev/null 2>&1; then
            echo "Vina must not be available in the APODOCK-001 preflight job" >&2
            exit 1
          fi

      - name: Execute published 10-case preflight without docking
        run: >-
          python scripts/preflight_apodock001.py
          --workdir /tmp/apodock001-preflight
          --output /tmp/apodock001-evidence/apodock001-preflight-v1.0.1.json

      - name: Enforce frozen prospective pre-Vina boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from research_os.docking.apodock001_freeze import validate_frozen_preflight

          path = Path('/tmp/apodock001-evidence/apodock001-preflight-v1.0.1.json')
          report = json.loads(path.read_text())
          validate_frozen_preflight(report)
          print('selection_manifest_hash=', report['selection_manifest_hash'])
          PY

      - name: Execute APD-010 chemistry gate without docking
        run: >-
          python scripts/preflight_apd010_bem_mav.py
          --workdir /tmp/apd010-bem-mav
          --output /tmp/apodock001-evidence/apd010-chemistry-gate-v1.0.1.json

      - name: Enforce APD-010 chemical gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('/tmp/apodock001-evidence/apd010-chemistry-gate-v1.0.1.json')
          report = json.loads(path.read_text())
          assert report['chemistry_ready_for_vina_count'] == 10
          assert report['structurally_eligible_count'] == 10
          assert report['apd010']['diagnostics']['formula'] == 'C12H18O13'
          assert report['apd010']['diagnostics']['heavy_atoms'] == 25
          assert report['apd010']['diagnostics']['fragment_count'] == 1
          assert report['docking_executed'] is False
          assert report['vina_imported_or_invoked'] is False
          print('APD-010 chemistry gate: 10/10, no docking')
          PY

      - name: Upload APODOCK-001 preflight evidence
        uses: actions/upload-artifact@v4
        with:
          name: apodock001-preflight-v1.0.1
          path: /tmp/apodock001-evidence
          if-no-files-found: error
