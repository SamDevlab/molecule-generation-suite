name: apodock001-v102-offline-preflight

on:
  pull_request:
    branches:
      - research-os-v1.3
    paths:
      - "configs/apodock001-protocol-freeze-v1.0.1.json"
      - "configs/apodock001-protocol-freeze-v1.0.2.json"
      - "inputs/apodock001/v1.0.2/**"
      - "src/research_os/docking/apodock001_*.py"
      - "scripts/audit_apodock001_sdf_provenance.py"
      - "scripts/build_apodock001_v102_bundle.py"
      - "scripts/preflight_apodock001_v102_offline.py"
      - "tests/test_apodock001_v102_bundle.py"
      - "docs/apodock001-input-bundle-v1.0.2.md"
      - "docs/apodock001-sdf-provenance-audit-v1.0.1.json"
      - ".github/workflows/apodock001-v102-offline.yml"

permissions:
  contents: read

jobs:
  offline-frozen-input-preflight:
    name: APODOCK-001 v1.0.2 offline preflight (no docking)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Research OS molecular dependencies
        run: python -m pip install -e ".[dev,molecule]"

      - name: Install and verify Open Babel 3.1.1
        run: |
          sudo apt-get update
          sudo apt-get install -y openbabel
          obabel -V

      - name: Download and verify frozen Vina 1.2.7
        run: |
          curl --fail --location --retry 3 \
            https://github.com/ccsb-scripps/AutoDock-Vina/releases/download/v1.2.7/vina_1.2.7_linux_x86_64 \
            --output /tmp/vina_1.2.7
          chmod +x /tmp/vina_1.2.7
          sha256sum /tmp/vina_1.2.7
          test "$(sha256sum /tmp/vina_1.2.7 | cut -d ' ' -f1)" = "f31f774f723bba7bbe6e9d1c47577020eea9a8da16424284c043d22593570644"
          /tmp/vina_1.2.7 --version

      - name: Verify protocol, bundle, and offline adapter tests
        run: |
          python -m pytest -q tests/test_apodock001_v102_bundle.py tests/test_apodock001_execution.py
          python -m py_compile \
            src/research_os/docking/apodock001_input_bundle.py \
            src/research_os/docking/apodock001_protocol.py \
            src/research_os/docking/apodock001_runner.py \
            src/research_os/docking/apodock001_execution.py \
            scripts/preflight_apodock001_v102_offline.py

      - name: Run offline v1.0.2 preflight and staging check
        run: >-
          python scripts/preflight_apodock001_v102_offline.py
          --git-sha "$GITHUB_SHA"
          --output /tmp/apodock001-v102-offline-preflight.json

      - name: Assert zero docking and empty results
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('/tmp/apodock001-v102-offline-preflight.json').read_text())
          assert report['chemistry_ready_count'] == 10
          assert report['offline_bundle_verified'] is True
          assert report['execution_plan_built'] is True
          assert report['staging_verified'] is True
          assert report['vina_docking_executed'] is False
          assert report['vina_received_receptor_or_ligand'] is False
          assert report['prospective_scores_or_poses_observed'] is False
          assert report['evidence_scaffold']['status'] == 'NOT_EXECUTED'
          assert report['evidence_scaffold']['results'] == []
          assert report['evidence_scaffold']['poses'] == []
          assert report['evidence_scaffold']['scores'] == []
          print('APODOCK-001 cases executed: 0/10')
          print('No APODOCK docking command was started.')
          PY

      - name: Upload offline preflight evidence
        uses: actions/upload-artifact@v4
        with:
          name: apodock001-v1.0.2-offline-preflight
          path: /tmp/apodock001-v102-offline-preflight.json
          if-no-files-found: error
