name: apodock001-glycan-preflight

on:
  pull_request:
    paths:
      - "src/research_os/docking/apodock_glycan.py"
      - "scripts/preflight_apd010_glycan.py"
      - "tests/test_apodock_glycan.py"
      - ".github/workflows/apodock001-glycan-preflight.yml"
  workflow_dispatch:

jobs:
  structural-preflight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install molecular test dependencies
        run: python -m pip install -e ".[dev,molecule]"
      - name: Check dependency consistency
        run: python -m pip check
      - name: Compile glycan preflight
        run: python -m py_compile src/research_os/docking/apodock_glycan.py scripts/preflight_apd010_glycan.py tests/test_apodock_glycan.py
      - name: Test glycan structural parsing
        run: python -m pytest -q tests/test_apodock_glycan.py tests/test_apodock001.py
      - name: Verify Vina binary is absent
        shell: bash
        run: |
          if command -v vina >/dev/null 2>&1; then
            echo "Vina must not be available during APD-010 glycan structural preflight" >&2
            exit 1
          fi
      - name: Inspect remediated 1Y3N glycan without docking
        run: |
          python scripts/preflight_apd010_glycan.py \
            --workdir /tmp/apd010-glycan \
            --output /tmp/apd010-evidence/apd010-glycan-preflight-v1.0.json
      - name: Enforce no-docking boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('/tmp/apd010-evidence/apd010-glycan-preflight-v1.0.json').read_text())
          assert report['adapter_implemented'] is False
          assert report['chemistry_ready_for_vina'] is False
          assert report['docking_executed'] is False
          assert report['vina_imported_or_invoked'] is False
          assert report['total_heavy_atoms'] == 24
          assert len(report['links']) == 1
          print('glycan_structural_identity=', report['glycan_structural_identity'])
          print('report_identity=', report['report_identity'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: apd010-glycan-preflight-v1.0
          path: /tmp/apd010-evidence
          if-no-files-found: error
