name: crossdock001-preflight

on:
  pull_request:
    branches:
      - research-os-v1.3
    paths:
      - "src/research_os/docking/crossdock001.py"
      - "src/research_os/docking/crossdock_alignment.py"
      - "src/research_os/docking/crossdock_identity.py"
      - "src/research_os/docking/crossdock001_freeze.py"
      - "src/research_os/docking/crossdock001_runner.py"
      - "scripts/preflight_crossdock001.py"
      - "scripts/run_crossdock001.py"
      - "tests/test_crossdock001.py"
      - "tests/test_crossdock001_freeze.py"
      - "tests/test_crossdock001_runner.py"
      - "docs/crossdocking-benchmark-001-rigid-v1.0.md"
      - ".github/workflows/crossdock001-ci.yml"

permissions:
  contents: read

jobs:
  structural-preflight-no-vina:
    name: CROSSDOCK-001 structural preflight (no Vina)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install structural preflight dependencies
        run: python -m pip install -e ".[dev,molecule]"

      - name: Check dependency consistency
        run: python -m pip check

      - name: Compile frozen cross-docking protocol and outcome-disabled runner
        run: >-
          python -m py_compile
          src/research_os/docking/crossdock001.py
          src/research_os/docking/crossdock_alignment.py
          src/research_os/docking/crossdock_identity.py
          src/research_os/docking/crossdock001_freeze.py
          src/research_os/docking/crossdock001_runner.py
          scripts/preflight_crossdock001.py
          scripts/run_crossdock001.py
          tests/test_crossdock001.py
          tests/test_crossdock001_freeze.py
          tests/test_crossdock001_runner.py

      - name: Test deterministic selection, alignment, portable freeze and scientific hashing
        run: >-
          python -m pytest -q
          tests/test_crossdock001.py
          tests/test_crossdock001_freeze.py
          tests/test_crossdock001_runner.py

      - name: Verify Vina binary is not installed for preflight
        shell: bash
        run: |
          if command -v vina >/dev/null 2>&1; then
            echo "Vina must not be available in the structural preflight job" >&2
            exit 1
          fi

      - name: Execute canonical structural preflight without docking
        run: >-
          python scripts/preflight_crossdock001.py
          --workdir /tmp/crossdock001-preflight
          --output /tmp/crossdock001-evidence/crossdock001-preflight-v1.0.json

      - name: Require exact portable freeze reproduction before Vina
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from research_os.docking.crossdock001_freeze import (
              FROZEN_DIRECTED_STRUCTURAL_IDENTITIES,
              PREFLIGHT_SELECTION_MANIFEST_HASH,
          )

          path = Path('/tmp/crossdock001-evidence/crossdock001-preflight-v1.0.json')
          report = json.loads(path.read_text())
          assert report['docking_executed'] is False
          assert report['vina_imported_or_invoked'] is False
          assert report['eligible_count'] == report['directed_case_count'] == 10
          assert report['selection_manifest_hash'] == PREFLIGHT_SELECTION_MANIFEST_HASH
          for record in report['records']:
              expected = FROZEN_DIRECTED_STRUCTURAL_IDENTITIES[record['case_id']]
              assert record['source_pdb_sha256'] == expected['source_pdb_sha256']
              assert record['target_pdb_sha256'] == expected['target_pdb_sha256']
              assert record['transformed_source_reference_coordinate_hash'] == expected['transformed_source_reference_coordinate_hash']
              assert record['target_reference_coordinate_hash'] == expected['target_reference_coordinate_hash']
              assert record['grid']['grid_hash'] == expected['grid_hash']
              assert record['matched_identical_pocket_ca_pairs'] == expected['matched_identical_pocket_ca_pairs']
          print('portable_selection_manifest_hash=', report['selection_manifest_hash'])
          PY

      - name: Upload CROSSDOCK-001 structural evidence
        uses: actions/upload-artifact@v4
        with:
          name: crossdock001-preflight-v1.0
          path: /tmp/crossdock001-evidence
          if-no-files-found: error
