name: research-os-ci

on:
  push:
    branches: ["research-os-v1.3"]
  pull_request:

jobs:
  test:
    name: core (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install Research OS core + molecular + data dependencies
        run: python -m pip install -e ".[dev,molecule,data]"
      - name: Check dependency consistency
        run: python -m pip check
      - name: Compile source and tests
        run: python -m compileall -q src tests
      - name: Run Research OS tests
        run: pytest -q
      - name: Execute declarative reference protocol twice
        run: |
          research-os run experiment examples/experiments/reference-regression.yaml --output /tmp/research-os-declarative-a
          research-os run experiment examples/experiments/reference-regression.yaml --output /tmp/research-os-declarative-b
      - name: Verify declarative reference package
        run: research-os run experiment-verify /tmp/research-os-declarative-a/REFERENCE-REGRESSION-001
      - name: Inspect declarative reference package
        run: research-os run experiment-inspect /tmp/research-os-declarative-a/REFERENCE-REGRESSION-001
      - name: Compare deterministic declarative reruns
        run: research-os run experiment-compare /tmp/research-os-declarative-a/REFERENCE-REGRESSION-001 /tmp/research-os-declarative-b/REFERENCE-REGRESSION-001

  cantera-reference:
    name: capability (Cantera reference)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install combustion capability
        run: python -m pip install -e ".[dev,molecule,combustion]"
      - name: Check dependency consistency
        run: python -m pip check
      - name: Execute real Cantera reference gate
        run: pytest -q tests/test_cantera_reference.py
