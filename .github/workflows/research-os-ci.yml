name: research-os-ci

on:
  push:
    branches: ["research-os-v1.3"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install Research OS core
        run: python -m pip install -e ".[dev]"
      - name: Run current Research OS branch tests
        run: pytest -q tests/test_thermal_lab.py tests/test_degradation_lab.py tests/test_legacy_migration_plan.py
