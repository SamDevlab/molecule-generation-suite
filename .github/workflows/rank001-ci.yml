name: rank-001-diagnostic

on:
  pull_request:
    branches: ["research-os-v1.3"]

jobs:
  rank001:
    name: capability (RANK-001 Astex-20 ranking diagnostic)
    if: github.head_ref == 'benchmark/rank001-astex20'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Research OS test capability
        run: python -m pip install -e ".[dev,molecule]"
      - name: Check dependency consistency
        run: python -m pip check
      - name: Test sealed ranking diagnostic
        run: pytest -q tests/test_ranking_diagnostic.py
      - name: Execute RANK-001 from sealed REDOCK-003 snapshot
        run: |
          python scripts/analyze_astex20_ranking.py \
            validation/rank001-astex20-input-v1.0.json \
            --output /tmp/rank-001-astex20/rank-001-astex20-v1.0.json
      - name: Upload RANK-001 evidence
        uses: actions/upload-artifact@v4
        with:
          name: rank-001-astex20-v1.0
          path: /tmp/rank-001-astex20
          if-no-files-found: error
