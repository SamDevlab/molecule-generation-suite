[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "research-os-core"
version = "5.1.0"
description = "Research Core + Proof Engine for molecule-generation-suite"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]
molecule = ["numpy>=1.26", "rdkit>=2024.3"]
combustion = ["cantera>=3.2"]
metals = ["pycalphad>=0.11", "matminer>=0.9"]
docking = ["openbabel-wheel>=3.1.1.23"]
materials = ["pymatgen>=2024.1", "matminer>=0.9"]
science = ["cantera>=3.2", "pycalphad>=0.11", "pymatgen>=2024.1", "matminer>=0.9"]
data = ["pyarrow>=15", "scipy>=1.11"]
query = ["duckdb>=1.0"]
legacy = [
  "numpy>=1.26",
  "pandas>=2.2",
  "rdkit>=2024.3",
  "scikit-learn>=1.5",
  "xgboost>=2.1",
  "joblib>=1.4",
  "matplotlib>=3.8",
  "seaborn>=0.13",
  "fpdf2>=2.7",
]

[project.scripts]
research-os = "research_os.cli:main"
research-os-web = "research_os.web:main"

[tool.setuptools.package-data]
research_os = ["oracle/live_output.schema.json", "oracle/live_grounding.schema.json", "oracle/live_consistency.schema.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "optional: tests that exercise optional scientific dependencies when installed",
  "integration: cross-component Research OS tests",
  "reference: real engine reference-case tests",
]
