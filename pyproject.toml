[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "research-os-core"
version = "1.5.0"
description = "Research Core + Proof Engine for molecule-generation-suite"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
molecule = ["numpy>=1.26", "rdkit>=2024.3"]
combustion = ["cantera>=3.2"]
metals = ["pycalphad>=0.11", "matminer>=0.9"]
data = ["pyarrow>=15"]
query = ["duckdb>=1.0"]

[project.scripts]
research-os = "research_os.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
